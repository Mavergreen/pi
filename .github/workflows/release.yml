name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repackage:
        description: "Publish a packaging-only .N+1 even though this declared state is released"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Record the toolchain
        run: |
          clang --version
          xcodebuild -version
          node --version

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Version (<upstream>-mavericks.N) + publish decision
        id: ver
        env:
          REPACKAGE: ${{ inputs.repackage }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          vout="$(sh "$SHIPYARD_SCRIPTS/version.sh" local)"
          ver="$(printf '%s\n' "$vout" | sed -n 's/^FULL=//p')"
          [ -n "$ver" ] || { echo "::error::version.sh local printed no FULL="; exit 1; }
          pub=no
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$REPACKAGE" = true ]; then
              pub=yes
            else
              digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
              answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$ver")"
              echo "release-needed: $answer"
              if [ "$answer" = PUBLISH ]; then pub=yes; fi
            fi
          fi
          printf '%s\n' "$ver" > VERSION
          { echo "ver=$ver"; echo "publish=$pub"; } >> "$GITHUB_OUTPUT"
          echo "version=$ver publish=$pub"

      - name: Configure (cross, pinned 10.9 SDK, with the updater)
        run: shipyard-cmake --preset cross -DPI_BUILD_UPDATER=ON

      - name: Build + compat guard
        run: shipyard-cmake --build --preset cross

      # spec: INGREDIENTS.md, rosetta:.github/workflows/release.yml -- tests/addon-compat-test.sh
      #       requires node24 under CI to dlopen the shipped x86_64 addon, translated on this arm64 runner
      - name: Ensure this runner can run x86_64 (Rosetta)
        run: |
          set -eu
          arch -x86_64 /usr/bin/true 2>/dev/null \
            || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true

      - name: Install node24 (components/node24/version), the runtime that loads the addon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          dl="$RUNNER_TEMP/node24"
          tag="$(tr -d ' \t\r\n' < components/node24/version)"
          gh release download "$tag" -R Mavergreen/nodejs-24 --pattern '*.pkg' --pattern SHA256SUMS --dir "$dl"
          set -- "$dl"/*.pkg
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::expected one .pkg in Mavergreen/nodejs-24's $tag release, got: $*"; exit 1; }
          name="$(basename "$1")"
          sum="$(awk -v f="$name" '$2 == f' "$dl/SHA256SUMS")"
          [ -n "$sum" ] || { echo "::error::$name is not in that release's SHA256SUMS"; exit 1; }
          ( cd "$dl" && printf '%s\n' "$sum" | shasum -a 256 -c - )
          sudo installer -pkg "$1" -target /
          test "$(lipo -info /usr/local/mavergreen/node24/bin/node | sed 's/.*: //')" = x86_64
          arch -x86_64 /usr/local/mavergreen/node24/bin/node --version

      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      - name: Build Pi's addon for 10.9 (x86_64 only)
        run: |
          set -eu
          out="$(sh build/build-addon.sh)"
          addon="$(printf '%s\n' "$out" | tail -n 1)"
          [ -f "$addon/darwin-platform.node" ] && [ -f "$addon/addon-source-id" ] \
            || { echo "::error::build-addon.sh named $addon, which lacks the addon or its source id"; exit 1; }
          echo "ADDON=$addon" >> "$GITHUB_ENV"

      - name: Locate the build
        run: echo "BUILD=${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-cross" >> "$GITHUB_ENV"

      - name: Package the .pkg
        run: sh packaging/build-pkg.sh "$BUILD" "$ADDON" "${{ steps.ver.outputs.ver }}" "$BUILD/dist/pi-${{ steps.ver.outputs.ver }}.pkg"

      - name: The package carries the launcher, the updater, the built addon and the seed version
        run: sh packaging/verify-pkg.sh "$BUILD/dist/pi-${{ steps.ver.outputs.ver }}.pkg" "$ADDON"

      - name: Ship the one-command installer
        run: cp packaging/install.sh "$BUILD/dist/install.sh"

      - name: Release notes
        run: |
          set -eu
          VER="${{ steps.ver.outputs.ver }}"
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$VER" --version "$VER" \
            --product Pi --min-os 10.9.5 --out "$BUILD/dist/RELEASE_NOTES.md"
      - name: Record the declared state in the notes
        if: steps.ver.outputs.publish == 'yes'
        run: |
          set -eu
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          sh "$SHIPYARD_SCRIPTS/release-state-record.sh" --notes-file "$BUILD/dist/RELEASE_NOTES.md" --digest "$digest"
      - name: Unsigned stand-in feeds (never published)
        if: steps.ver.outputs.publish != 'yes'
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" "$BUILD/dist" "${{ steps.ver.outputs.ver }}"

      - name: EdDSA-sign the .pkg + write pi.xml
        if: steps.ver.outputs.publish == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          VER="${{ steps.ver.outputs.ver }}"
          PKG="$BUILD/dist/pi-$VER.pkg"
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --product pi --feed-dir "$BUILD/dist" \
            --channel-title "Pi for Mavericks" --version "$VER" \
            --pkg-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG")" \
            --notes-file "$BUILD/dist/RELEASE_NOTES.md" --pkg "$PKG" --min-os 10.9.5

      - name: Artifact conformance
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$BUILD/dist" "${{ steps.ver.outputs.ver }}" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: The feed is an upgrade on its line
        if: steps.ver.outputs.publish == 'yes'
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "$BUILD/dist/pi.xml" \
            --version "${{ steps.ver.outputs.ver }}" --tag-glob '*-mavericks.*'

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: pi
          path: ${{ env.BUILD }}/dist/*

  scan:
    needs: [build]
    if: always() && (needs.build.outputs.publish == 'yes')
    permissions:
      actions: read
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: pi
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    needs: [build, scan]
    if: needs.build.outputs.publish == 'yes'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.ver }}
      artifact: pi
